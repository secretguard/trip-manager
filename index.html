<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trip Tracker</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Trip Tracker">
<meta property="og:description" content="A personal trip planning and expense tool.">
<meta property="og:url" content="https://trip.sarathg.me/">
<meta property="og:image" content="https://trip.sarathg.me/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Trip Tracker | Sarath G">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Trip Tracker">
<meta name="twitter:description" content="A personal trip planning and expense tool.">
<meta name="twitter:image" content="https://trip.sarathg.me/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="config.js"></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0c0f;
  --surface:#111418;
  --surface2:#181c22;
  --border:#1e2530;
  --border2:#252d38;
  --text:#e8ecf0;
  --text2:#8892a0;
  --text3:#505a68;
  --accent:#3b82f6;
  --accent2:#60a5fa;
  --green:#22c55e;
  --amber:#f59e0b;
  --red:#ef4444;
  --purple:#a855f7;
  --cyan:#06b6d4;
  --font:'Roboto',sans-serif;
  --mono:'Roboto Mono',monospace;
  --r:12px;
  --r2:8px;
  --shadow:0 4px 24px rgba(0,0,0,.4);
}
html{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;font-size:14px}.emoji{font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
body{height:100%;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input,select,textarea{font-family:var(--mono);font-size:13px;background:var(--surface2);border:1px solid var(--border2);color:var(--text);border-radius:var(--r2);padding:10px 12px;outline:none;width:100%;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
label{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);display:block;margin-bottom:6px}
a{color:var(--accent2);text-decoration:none}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* App Shell */
#app{display:flex;height:100vh;width:100vw;overflow:hidden}

/* Sidebar */
#sidebar{
  width:232px;min-width:232px;background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  z-index:10;transition:transform .3s ease;
}
.sidebar-logo{padding:24px 20px 18px;border-bottom:1px solid var(--border)}
.sidebar-logo .logo-text{font-size:17px;font-weight:700;letter-spacing:.02em;color:var(--text)}
.sidebar-logo .logo-sub{font-size:10px;color:var(--text3);font-family:var(--mono);margin-top:3px;letter-spacing:.08em}

.nav-section{padding:14px 10px 0;flex:1;overflow-y:auto}
.nav-section-label{font-size:9px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);padding:0 10px;margin-bottom:6px}
.nav-item{
  display:flex;align-items:center;gap:9px;
  padding:8px 10px;border-radius:var(--r2);
  font-size:13px;font-weight:400;
  color:var(--text2);cursor:pointer;
  transition:all .15s;margin-bottom:1px;
}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:rgba(59,130,246,.12);color:var(--accent2)}
.nav-item .ni{width:16px;height:16px;opacity:.6;flex-shrink:0}
.nav-item.active .ni{opacity:1}

.sidebar-footer{padding:14px;border-top:1px solid var(--border)}
.sidebar-footer .version{font-size:10px;color:var(--text3);font-family:var(--mono)}

/* Main */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{
  height:52px;min-height:52px;
  background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 20px;gap:14px;
}
.topbar-title{font-size:14px;font-weight:500;flex:1;color:var(--text)}
.topbar-actions{display:flex;align-items:center;gap:8px}
#page-container{flex:1;overflow-y:auto;padding:20px}

/* PIN Screen */
#pin-screen{
  position:fixed;inset:0;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:1000;
}
.pin-logo{font-size:22px;font-weight:700;letter-spacing:.04em;margin-bottom:6px}
.pin-sub{font-size:11px;color:var(--text3);font-family:var(--mono);margin-bottom:44px;letter-spacing:.1em}
.pin-dots{display:flex;gap:14px;margin-bottom:28px}
.pin-dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--border2);background:transparent;transition:all .2s}
.pin-dot.filled{background:var(--accent);border-color:var(--accent)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:224px}
.pin-key{height:60px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border2);font-size:20px;font-weight:400;color:var(--text);transition:all .15s;user-select:none}
.pin-key:hover{background:var(--surface2);border-color:var(--accent)}
.pin-key:active{transform:scale(.95)}
.pin-key.del{font-size:14px;color:var(--text2)}
.pin-key.empty{background:transparent;border:none;cursor:default}
.pin-error{color:var(--red);font-size:11px;font-family:var(--mono);text-align:center;min-height:18px;margin-top:10px}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px}
.card-sm{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}

/* Stat Tiles */
.stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.stat-tile .stat-label{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.stat-tile .stat-value{font-size:28px;font-weight:300;letter-spacing:-.01em;line-height:1;font-family:var(--mono)}
.stat-tile .stat-sub{font-size:11px;color:var(--text3);font-family:var(--mono);margin-top:3px}

/* Trip Cards */
.trip-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.trip-card:hover{border-color:var(--border2);box-shadow:var(--shadow)}
.trip-card .trip-flag{font-size:24px;margin-bottom:8px;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
.trip-card .trip-name{font-size:14px;font-weight:500;margin-bottom:3px}
.trip-card .trip-dest{font-size:11px;color:var(--text2);font-family:var(--mono)}
.trip-card .trip-dates{font-size:10px;color:var(--text3);font-family:var(--mono);margin-top:6px}
.trip-card .trip-status{position:absolute;top:12px;right:12px;font-size:9px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:20px}
.trip-status.present{background:rgba(34,197,94,.12);color:var(--green);border:1px solid rgba(34,197,94,.25)}
.trip-status.upcoming{background:rgba(59,130,246,.12);color:var(--accent2);border:1px solid rgba(59,130,246,.25)}
.trip-status.past{background:rgba(80,90,104,.1);color:var(--text3);border:1px solid var(--border2)}

/* Hero Trip */
.hero-trip{background:var(--surface2);border:1px solid var(--border2);border-radius:14px;padding:24px;margin-bottom:20px;position:relative;overflow:hidden}
.hero-trip::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at top right,rgba(59,130,246,.06) 0%,transparent 60%);pointer-events:none}
.hero-trip .hero-label{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--accent2);margin-bottom:10px}
.hero-trip .hero-flag{font-size:40px;margin-bottom:10px;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
.hero-trip .hero-name{font-size:22px;font-weight:500;margin-bottom:3px}
.hero-trip .hero-dest{font-size:13px;color:var(--text2);margin-bottom:14px}

/* Badges */
.badge{display:inline-flex;align-items:center;font-size:9px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:20px}
.badge-blue{background:rgba(59,130,246,.12);color:var(--accent2);border:1px solid rgba(59,130,246,.2)}
.badge-green{background:rgba(34,197,94,.12);color:var(--green);border:1px solid rgba(34,197,94,.2)}
.badge-amber{background:rgba(245,158,11,.12);color:var(--amber);border:1px solid rgba(245,158,11,.2)}
.badge-red{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.2)}
.badge-purple{background:rgba(168,85,247,.12);color:var(--purple);border:1px solid rgba(168,85,247,.2)}
.badge-gray{background:var(--surface2);color:var(--text3);border:1px solid var(--border2)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--font);font-size:13px;font-weight:500;padding:8px 14px;border-radius:var(--r2);transition:all .15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#2563eb}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border2)}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent2)}
.btn-danger{background:rgba(239,68,68,.08);color:var(--red);border:1px solid rgba(239,68,68,.18)}
.btn-danger:hover{background:rgba(239,68,68,.16)}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-icon{padding:7px;border-radius:var(--r2);background:var(--surface2);color:var(--text2);border:1px solid var(--border2)}
.btn-icon:hover{color:var(--text);border-color:var(--border2)}

/* Table */
.data-table{width:100%;border-collapse:collapse}
.data-table th{font-size:10px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--text3);padding:8px 12px;text-align:left;border-bottom:1px solid var(--border)}
.data-table td{font-size:13px;padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle;font-family:var(--mono)}
.data-table tr:hover td{background:var(--surface2)}
.data-table tr:last-child td{border-bottom:none}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:500;padding:20px;backdrop-filter:blur(3px)}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:14px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;animation:modalIn .2s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(6px) scale(.99)}to{opacity:1;transform:none}}
.modal-header{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);z-index:1}
.modal-header h2{font-size:15px;font-weight:500}
.modal-body{padding:22px}
.modal-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}

/* Form */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.form-group{margin-bottom:14px}

/* Section header */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-title{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}

/* Tabs */
.tabs{display:flex;gap:2px;background:var(--surface2);border-radius:10px;padding:3px;margin-bottom:18px}
.tab{flex:1;text-align:center;font-size:12px;font-weight:400;padding:6px;border-radius:8px;color:var(--text2);cursor:pointer;transition:all .15s}
.tab.active{background:var(--surface);color:var(--text)}

/* Flight item */
.flight-item{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:6px}
.flight-num{font-family:var(--mono);font-size:12px;color:var(--accent2);min-width:56px}
.flight-route{flex:1;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:13px}
.flight-route .arrow{color:var(--text3);font-size:10px}
.flight-time{font-size:10px;color:var(--text3);font-family:var(--mono);text-align:right}

/* Hotel item */
.hotel-item{padding:12px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:6px}
.hotel-name{font-size:13px;font-weight:500;margin-bottom:3px}
.hotel-meta{font-size:11px;color:var(--text2);font-family:var(--mono)}

/* DA tracker */
.da-tracker{background:rgba(34,197,94,.05);border:1px solid rgba(34,197,94,.18);border-radius:var(--r);padding:18px}
.da-big{font-size:32px;font-weight:300;color:var(--green);font-family:var(--mono)}

/* World clock */
.clock-item{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:14px;text-align:center}
.clock-time{font-size:26px;font-weight:300;font-family:var(--mono);letter-spacing:.04em}
.clock-city{font-size:11px;color:var(--text2);margin-top:3px;font-family:var(--mono)}
.clock-date{font-size:10px;color:var(--text3);font-family:var(--mono);margin-top:2px}

/* Visa cards */
.visa-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.visa-card .visa-country{font-size:13px;font-weight:500;margin-bottom:5px}
.visa-card .visa-meta{font-size:11px;color:var(--text2);font-family:var(--mono)}
.visa-card .visa-expiry{font-size:11px;margin-top:5px;font-family:var(--mono)}

/* Rate cards */
.rate-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:14px;text-align:center}
.rate-val{font-size:20px;font-weight:400;font-family:var(--mono)}
.rate-label{font-size:10px;color:var(--text3);font-family:var(--mono);margin-top:2px;letter-spacing:.07em;text-transform:uppercase}
.rate-inv{font-size:11px;color:var(--text2);font-family:var(--mono);margin-top:3px}

/* Expense */
.expense-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--border)}
.expense-cat{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.expense-desc{flex:1;font-size:13px}
.expense-meta{font-size:10px;color:var(--text3);font-family:var(--mono);margin-top:1px}
.expense-amt{font-size:13px;font-family:var(--mono);text-align:right}
.expense-ta{font-size:9px;color:var(--green);font-family:var(--mono);margin-top:1px;text-align:right}

/* Places */
.place-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);transition:background .15s}
.place-item:hover{background:var(--surface2)}
.place-icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.place-name{font-size:13px;font-weight:400}
.place-notes{font-size:11px;color:var(--text2);font-family:var(--mono);margin-top:1px}

/* Loading / Toast */
.loading{display:flex;align-items:center;justify-content:center;gap:8px;padding:40px;color:var(--text3);font-size:13px;font-family:var(--mono)}
.spinner{width:15px;height:15px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:20px;right:20px;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r);padding:10px 14px;font-size:12px;z-index:2000;transform:translateY(60px);opacity:0;transition:all .25s cubic-bezier(.34,1.56,.64,1);max-width:300px;font-family:var(--mono)}
#toast.show{transform:none;opacity:1}
#toast.success{border-left:3px solid var(--green)}
#toast.error{border-left:3px solid var(--red)}

/* Mobile */
#menu-toggle{display:none;width:34px;height:34px;align-items:center;justify-content:center;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r2);color:var(--text);font-size:15px}
#sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9}

/* Empty state */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;color:var(--text3);gap:10px}
.empty-state .empty-icon{font-size:36px;opacity:.4}
.empty-state p{font-size:12px;font-family:var(--mono)}

/* Countdown */
.countdown-block{display:flex;gap:10px;margin-top:10px}
.countdown-unit{text-align:center}
.countdown-num{font-size:24px;font-weight:300;font-family:var(--mono);background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:5px 9px;min-width:46px;display:block;line-height:1}
.countdown-label{font-size:9px;color:var(--text3);font-family:var(--mono);margin-top:3px;letter-spacing:.07em;text-transform:uppercase}

/* Sub sections */
.sub-section{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);margin-top:14px;overflow:hidden}
.sub-section-header{padding:11px 14px;display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);cursor:pointer}
.sub-section-header:hover{background:rgba(255,255,255,.02)}
.sub-section-body{padding:0 14px 14px}

/* Search */
.search-bar{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r2);padding:7px 12px}
.search-bar input{background:none;border:none;padding:0;font-size:13px}
.search-bar input:focus{border:none}

/* AI box */
.ai-box{background:rgba(168,85,247,.04);border:1px solid rgba(168,85,247,.18);border-radius:var(--r);padding:14px;margin-top:10px}
.ai-box .ai-label{font-size:9px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--purple);margin-bottom:6px}
.ai-box p{font-size:12px;line-height:1.6;color:var(--text2);font-family:var(--mono);white-space:pre-wrap}

/* Import/Seed UI */
.seed-step{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:12px}
.seed-step h3{font-size:13px;font-weight:500;margin-bottom:6px}
.seed-step p{font-size:12px;color:var(--text2);font-family:var(--mono);line-height:1.5}

@media(max-width:768px){
  #sidebar{position:fixed;left:0;top:0;bottom:0;z-index:10;transform:translateX(-100%)}
  #sidebar.open{transform:none}
  #sidebar-overlay.show{display:block}
  #menu-toggle{display:flex}
  #page-container{padding:14px}
  .grid-4{grid-template-columns:1fr 1fr}
  .grid-3{grid-template-columns:1fr 1fr}
  .grid-2{grid-template-columns:1fr}
  .form-row{grid-template-columns:1fr}
  .modal{max-width:100%;border-radius:14px 14px 0 0;position:fixed;bottom:0;left:0;right:0;max-height:95vh}
  .modal-overlay{align-items:flex-end;padding:0}
}
@media(max-width:480px){.grid-4{grid-template-columns:1fr 1fr}}
</style>

<body>

<!-- PIN Screen -->
<div id="pin-screen">
  <div class="pin-logo">✈ TRIP TRACKER</div>
  <div class="pin-sub">SARATH · PERSONAL</div>
  <div class="pin-dots" id="pin-dots">
    <div class="pin-dot" id="d0"></div><div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div><div class="pin-dot" id="d3"></div>
  </div>
  <div class="pin-pad" id="pin-pad">
    <button class="pin-key" onclick="pinKey('1')">1</button>
    <button class="pin-key" onclick="pinKey('2')">2</button>
    <button class="pin-key" onclick="pinKey('3')">3</button>
    <button class="pin-key" onclick="pinKey('4')">4</button>
    <button class="pin-key" onclick="pinKey('5')">5</button>
    <button class="pin-key" onclick="pinKey('6')">6</button>
    <button class="pin-key" onclick="pinKey('7')">7</button>
    <button class="pin-key" onclick="pinKey('8')">8</button>
    <button class="pin-key" onclick="pinKey('9')">9</button>

<div id="toast"></div>
<div id="modal-container"></div>

<script>
// ─── State ────────────────────────────────────────────────
let appData = { trips:[], visas:[], flightHistory:[] };
let currentPage = 'dashboard';
let clockInterval = null;
let pinBuffer = '';
let pinLocked = false;
let exchangeRates = null;
let frozenRates = null;      // today's rates, fetched once per session
let frozenRatesDate = null;  // date string when rates were fetched

async function ensureFrozenRates() {
  if (frozenRates) return frozenRates;
  try {
    const res = await apiRates();
    if (res.ok) {
      frozenRates = res.rates;
      frozenRatesDate = new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
      exchangeRates = res.rates;
    }
  } catch(e) {}
  return frozenRates;
}

// Convert any amount in fromCur to INR using frozenRates
function toINR(amount, fromCur) {
  if (!frozenRates) return null;
  const amt = parseFloat(amount) || 0;
  if (!fromCur || fromCur === 'INR') return amt;
  const rate = frozenRates[fromCur]; // rate = how much fromCur per 1 INR
  if (!rate) return null;
  return amt / rate;
}

// Resolve GAS URL: config.js first, localStorage fallback
function getGasUrl() {
  // If config.js has a real URL (not the placeholder), use it
  if (typeof GAS_URL !== 'undefined' && GAS_URL && !GAS_URL.includes('YOUR_DEPLOYMENT_ID')) {
    return GAS_URL;
  }
  // Fallback: manually saved URL
  return localStorage.getItem('gas_url') || '';
}

// ─── Toast ────────────────────────────────────────────────
function toast(msg, type='success', dur=3000) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `show ${type}`;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.className = '', dur);
}

// ─── PIN ──────────────────────────────────────────────────
const styleEl = document.createElement('style');
styleEl.textContent = '@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}';
document.head.appendChild(styleEl);

function pinKey(k) {
  if (pinLocked || pinBuffer.length >= 4) return;
  pinBuffer += k;
  updatePinDots();
  if (pinBuffer.length === 4) setTimeout(submitPin, 120);
}
function pinDel() {
  pinBuffer = pinBuffer.slice(0, -1);
  updatePinDots();
  document.getElementById('pin-error').textContent = '';
}
function updatePinDots() {
  for (let i = 0; i < 4; i++)
    document.getElementById('d'+i).classList.toggle('filled', i < pinBuffer.length);
}

async function submitPin() {
  const url = getGasUrl();
  if (!url) {
    document.getElementById('pin-screen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    navigate('settings');
    return;
  }
  try {
    // GET-only: pin passed as query param — no preflight, no CORS issue
    const res = await fetch(`${url}?action=auth&pin=${encodeURIComponent(pinBuffer)}`);
    const data = await res.json();
    if (data.ok) {
      localStorage.setItem('trip_token', data.token);
      await bootApp();
    } else {
      document.getElementById('pin-error').textContent = data.error || 'Wrong PIN';
      pinBuffer = ''; updatePinDots();
      const pad = document.getElementById('pin-pad');
      pad.style.animation = 'none'; pad.offsetHeight; pad.style.animation = 'shake .35s ease';
      if (data.code === 429) pinLocked = true;
    }
  } catch(e) {
    document.getElementById('pin-error').textContent = 'Connection failed';
    pinBuffer = ''; updatePinDots();
  }
}

async function bootApp() {
  document.getElementById('pin-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  try {
    const data = await apiLoad();
    appData = data;
  } catch(e) { toast('Failed to load data: ' + e.message, 'error'); }
  navigate('dashboard');
}

window.addEventListener('load', async () => {
  const url = getGasUrl();
  const token = localStorage.getItem('trip_token');
  if (!url) return;
  if (token) {
    try {
      const res = await fetch(`${url}?action=ping&token=${encodeURIComponent(token)}`);
      const d = await res.json();
      if (d.ok) { await bootApp(); return; }
    } catch(e) {}
    localStorage.removeItem('trip_token');
  }
});

// ─── API — all GET, payload in query params ────────────────
// GAS does not handle OPTIONS preflight. By using only GET with
// simple (non-custom) headers, the browser skips preflight entirely.

function gasUrl() {
  const url = getGasUrl();
  if (!url) throw new Error('GAS URL not configured. Go to Settings.');
  return url;
}
function tok() { return localStorage.getItem('trip_token') || ''; }

// ── GET helper — for all read actions (no preflight) ──────────
async function gasGet(params) {
  params.token = tok();
  const qs = Object.entries(params)
    .map(([k,v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v))
    .join('&');
  const res = await fetch(gasUrl() + '?' + qs);
  const data = await res.json();
  if (!data.ok && data.code === 401) { localStorage.removeItem('trip_token'); location.reload(); }
  return data;
}

// ── POST helper — for save only ───────────────────────────────
// Uses text/plain content-type, which browsers treat as a "simple"
// request — no CORS preflight fired. GAS reads e.postData.contents.
async function gasPost(body) {
  const res = await fetch(gasUrl(), {
    method: 'POST',
    // text/plain is a CORS "simple" content type — no preflight
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(body)
  });
  const data = await res.json();
  if (!data.ok && data.code === 401) { localStorage.removeItem('trip_token'); location.reload(); }
  return data;
}

async function apiLoad() {
  const d = await gasGet({ action: 'load' });
  if (!d.ok) throw new Error(d.error);
  return d.data;
}

async function apiSave() {
  // POST with text/plain — no URL length limit, no preflight
  const d = await gasPost({ action: 'save', token: tok(), data: appData });
  if (!d.ok) throw new Error(d.error);
  toast('Saved ✓');
  return d;
}

async function apiFlightStatus(num) {
  return gasGet({ action: 'flightStatus', flight: num });
}

async function apiRates() {
  return gasGet({ action: 'exchangeRates' });
}

async function apiAiSuggest(city, country) {
  return gasGet({ action: 'aiSuggest', city, country: country || '' });
}

async function apiAiExpense(summary) {
  return gasGet({ action: 'aiExpense', summary: JSON.stringify(summary) });
}

async function apiAiFlightInfo(flightNum, from, to, airline, duration) {
  return gasGet({
    action: 'aiFlightInfo',
    flight: flightNum,
    from,
    to,
    airline: airline || '',
    duration: duration || '',
  });
}

// ─── Helpers ──────────────────────────────────────────────
function uuid() { return crypto.randomUUID(); }
function fmt(d) { if(!d) return '—'; return new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}); }
function daysBetween(a, b) { return Math.ceil((new Date(b) - new Date(a)) / 86400000); }
function daysUntil(d) { return Math.ceil((new Date(d+'T00:00:00') - new Date()) / 86400000); }
function tripStatus(t) {
  const now = new Date(); const s = new Date(t.startDate+'T00:00:00'); const e = new Date(t.endDate+'T23:59:59');
  if (now < s) return 'upcoming'; if (now > e) return 'past'; return 'present';
}
function tripStatusBadge(s) {
  if (s==='present') return '<span class="badge badge-green">Active</span>';
  if (s==='upcoming') return '<span class="badge badge-blue">Upcoming</span>';
  return '<span class="badge badge-gray">Past</span>';
}
const catEmoji = {food:'🍜',culture:'🎭',nature:'🌿',entertainment:'🎡',shopping:'🛍',history:'🏛',hotel:'🏨',transport:'🚕',laundry:'👔',alcohol:'🍷',cigarettes:'🚬',misc:'📦',other:'📦'};

function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebar-overlay').classList.remove('show'); }
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebar-overlay').classList.toggle('show'); }

// ─── Navigation ───────────────────────────────────────────
function navigate(page, ...args) {
  currentPage = page;
  closeSidebar();
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.page === page));
  if (clockInterval && page !== 'clock') { clearInterval(clockInterval); clockInterval = null; }
  const titles = {dashboard:'Dashboard',present:'Active Trip',future:'Upcoming Trips',past:'Past Trips',flights:'Flight Manager',currency:'Currency & Expenses',clock:'World Clock',visas:'Visa Manager',settings:'Settings'};
  document.getElementById('topbar-title').textContent = titles[page] || page;
  document.getElementById('topbar-actions').innerHTML = '';
  switch(page) {
    case 'dashboard':  renderDashboard(); break;
    case 'present':    renderPresent(); break;
    case 'future':     renderFuture(); break;
    case 'past':       renderPast(); break;
    case 'flights':    renderFlights(); break;
    case 'currency':   renderCurrency(); break;
    case 'clock':      renderClock(); break;
    case 'visas':      renderVisas(); break;
    case 'settings':   renderSettings(); break;
    case 'tripDetail': renderTripDetail(args[0]); break;
  }
}

// ─── Dashboard ────────────────────────────────────────────
function renderDashboard() {
  const trips = appData.trips||[];
  const stats = calcStats(trips);
  const active = trips.filter(t=>tripStatus(t)==='present');
  const next = trips.filter(t=>tripStatus(t)==='upcoming').sort((a,b)=>new Date(a.startDate)-new Date(b.startDate))[0];

  let heroHtml = '';
  if (active.length) {
    const t = active[0];
    const day = Math.max(1, daysBetween(t.startDate, new Date().toISOString().split('T')[0]) + 1);
    const total = daysBetween(t.startDate, t.endDate);
    heroHtml = `<div class="hero-trip">
      <div class="hero-label">🟢 Active Now — Day ${day} of ${total}</div>
      <div class="hero-flag">${t.destination?.flag||'🌍'}</div>
      <div class="hero-name">${t.name}</div>
      <div class="hero-dest">${t.destination?.city||''}, ${t.destination?.country||''}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">
        <span class="badge badge-green">In Progress</span>
        <span class="badge badge-gray">${fmt(t.startDate)} – ${fmt(t.endDate)}</span>
        <span class="badge ${t.type==='international'?'badge-blue':'badge-amber'}">${t.type}</span>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary btn-sm" onclick="navigate('present')">Open Trip</button>
        <button class="btn btn-secondary btn-sm" onclick="navigate('tripDetail','${t.id}')">Details</button>
      </div>
    </div>`;
  } else if (next) {
    const d = daysUntil(next.startDate);
    heroHtml = `<div class="hero-trip">
      <div class="hero-label">⏭ Next Trip — in ${d} day${d!==1?'s':''}</div>
      <div class="hero-flag">${next.destination?.flag||'✈️'}</div>
      <div class="hero-name">${next.name}</div>
      <div class="hero-dest">${next.destination?.city||''}, ${next.destination?.country||''}</div>
      ${renderCountdown(next.startDate)}
    </div>`;
  } else {
    heroHtml = `<div class="hero-trip" style="text-align:center">
      <div style="font-size:36px;margin-bottom:10px">✈️</div>
      <div class="hero-name" style="font-size:17px">No active trips</div>
      <div class="hero-dest" style="margin-bottom:14px">Add your first trip to get started</div>
      <div style="display:flex;gap:8px;justify-content:center">
        <button class="btn btn-primary btn-sm" onclick="showAddTrip()">+ Add Trip</button>
        <button class="btn btn-secondary btn-sm" onclick="showImport()">Import Data</button>
      </div>
    </div>`;
  }

  document.getElementById('topbar-actions').innerHTML = `
    <button class="btn btn-secondary btn-sm" onclick="showImport()">Import</button>
    <button class="btn btn-primary btn-sm" onclick="showAddTrip()">+ Trip</button>`;

  document.getElementById('page-container').innerHTML = `
    ${heroHtml}
    <div class="grid-4" style="margin-bottom:20px">
      <div class="stat-tile" style="cursor:pointer" onclick="navigate('past')"><div class="stat-label">Total Trips</div><div class="stat-value">${stats.total}</div><div class="stat-sub">${stats.intl} intl · ${stats.dom} domestic</div></div>
      <div class="stat-tile" style="cursor:pointer" onclick="navigate('past')"><div class="stat-label">Countries</div><div class="stat-value">${stats.countries}</div><div class="stat-sub">visited</div></div>
      <div class="stat-tile" style="cursor:pointer" onclick="navigate('flights')"><div class="stat-label">Flights</div><div class="stat-value">${stats.flights}</div><div class="stat-sub">total segments</div></div>
      <div class="stat-tile" style="cursor:pointer" onclick="navigate('past')"><div class="stat-label">Days Abroad</div><div class="stat-value">${stats.daysAbroad}</div><div class="stat-sub">travel days</div></div>
    </div>
    ${trips.length ? `
    <div class="section-header">
      <div class="section-title">Recent Trips</div>
      <button class="btn btn-secondary btn-sm" onclick="navigate('past')">All trips</button>
    </div>
    <div class="grid-3">${trips.slice().sort((a,b)=>new Date(b.startDate)-new Date(a.startDate)).slice(0,6).map(tripCardHtml).join('')}</div>` : ''}`;
}

function renderCountdown(dateStr) {
  const d = daysUntil(dateStr);
  if (d <= 0) return '<span class="badge badge-green">Today!</span>';
  const wks = Math.floor(d/7), rem = d%7;
  return `<div class="countdown-block">
    ${wks?`<div class="countdown-unit"><span class="countdown-num">${wks}</span><div class="countdown-label">wks</div></div>`:''}
    ${(rem||!wks)?`<div class="countdown-unit"><span class="countdown-num">${rem||d}</span><div class="countdown-label">days</div></div>`:''}
  </div>`;
}

function calcStats(trips) {
  const countries = new Set(trips.map(t=>t.destination?.country).filter(Boolean));
  const flights = trips.reduce((a,t)=>a+(t.flights?.length||0),0);
  const daysAbroad = trips.reduce((a,t)=>t.startDate&&t.endDate?a+Math.max(0,daysBetween(t.startDate,t.endDate)):a,0);
  return {total:trips.length,intl:trips.filter(t=>t.type==='international').length,dom:trips.filter(t=>t.type==='domestic').length,countries:countries.size,flights,daysAbroad};
}

function tripCardHtml(t) {
  const s = tripStatus(t);
  return `<div class="trip-card" onclick="navigate('tripDetail','${t.id}')">
    <span class="trip-status ${s}">${s}</span>
    <div class="trip-flag">${t.destination?.flag||'🌍'}</div>
    <div class="trip-name">${t.name}</div>
    <div class="trip-dest">${t.destination?.city||''}${t.destination?.country?', '+t.destination.country:''}</div>
    <div class="trip-dates">${fmt(t.startDate)} → ${fmt(t.endDate)}</div>
  </div>`;
}

// ─── Present / Active ─────────────────────────────────────
function renderPresent() {
  const active = (appData.trips||[]).filter(t=>tripStatus(t)==='present');
  const pc = document.getElementById('page-container');
  if (!active.length) {
    pc.innerHTML = `<div class="empty-state"><div class="empty-icon">⏸</div><p>No active trip right now</p><button class="btn btn-secondary btn-sm" style="margin-top:8px" onclick="navigate('future')">View upcoming</button></div>`;
    return;
  }
  renderTripDetailContent(active[0], pc);
}

// ─── Trip Detail ──────────────────────────────────────────
function renderTripDetail(id) {
  const t = (appData.trips||[]).find(x=>x.id===id);
  if (!t) { document.getElementById('page-container').innerHTML = '<div class="empty-state"><p>Trip not found</p></div>'; return; }
  document.getElementById('topbar-title').textContent = t.name;
  document.getElementById('topbar-actions').innerHTML = `
    <button class="btn btn-secondary btn-sm" onclick="showEditTrip('${t.id}')">Edit</button>
    <button class="btn btn-danger btn-sm" onclick="confirmDeleteTrip('${t.id}')">Delete</button>`;
  renderTripDetailContent(t, document.getElementById('page-container'));
}

async function renderTripDetailContent(t, container) {
  // Show a quick skeleton while rates load
  container.innerHTML = `<div class="loading"><div class="spinner"></div> Loading...</div>`;
  await ensureFrozenRates();

  const nights = (t.hotels||[]).reduce((a,h)=>a+(h.nights||0),0);
  const exps = t.expenses||[];
  const s = tripStatus(t);

  // Total expenses in local currency (destination currency)
  const localCur = t.destination?.currency || 'INR';
  const localTotal = exps.filter(e=>(e.currency||'INR')===localCur).reduce((a,e)=>a+(parseFloat(e.amount)||0),0);

  // Total all expenses in INR
  let totalExpINR = 0;
  exps.forEach(e => {
    const inr = toINR(e.amount, e.currency||'INR');
    if (inr !== null) totalExpINR += inr;
  });

  let daHtml = '';
  if (t.da && (t.da.intlRateUSD || t.da.indiaRateINR)) {
    const days = daysBetween(t.startDate, t.endDate);
    const isIntl = t.type === 'international';
    const rate = isIntl ? t.da.intlRateUSD : t.da.indiaRateINR;
    const sym = isIntl ? '$' : '₹';
    const total = days * rate;

    // DA in INR (for international trips, convert USD → INR)
    let daINRHtml = '';
    if (isIntl && frozenRates) {
      const usdRate = frozenRates['USD'];
      if (usdRate) {
        const totalINR = total / usdRate;
        daINRHtml = `<div style="font-size:13px;color:var(--text2);font-family:var(--mono);margin-top:2px">≈ ₹${totalINR.toFixed(2)}</div>`;
      }
    }

    // TA spent — sum each TA expense converted to INR
    let taINR = 0;
    exps.filter(e=>e.isTA).forEach(e=>{
      const inr = toINR(e.amount, e.currency||'INR');
      if (inr !== null) taINR += inr;
    });

    const rateNote = frozenRatesDate ? `<div style="font-size:9px;color:var(--text3);font-family:var(--mono);margin-top:3px">rate as of ${frozenRatesDate}</div>` : '';

    daHtml = `<div class="da-tracker" style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px">
        <div>
          <div class="section-title" style="margin-bottom:4px">Daily Allowance</div>
          <div class="da-big">${sym}${total.toLocaleString()} ${isIntl?'USD':''}</div>
          ${daINRHtml}
          <div style="font-size:11px;color:var(--text2);font-family:var(--mono);margin-top:3px">${days} days × ${sym}${rate}/day</div>
          ${rateNote}
        </div>
        <div style="text-align:right">
          <div class="section-title" style="margin-bottom:4px">TA Spent</div>
          <div style="font-size:20px;font-weight:400;color:var(--amber);font-family:var(--mono)">₹${taINR.toFixed(2)}</div>
          <div style="font-size:10px;color:var(--text3);font-family:var(--mono)">reimbursable · in INR</div>
          ${rateNote}

  }

  container.innerHTML = `
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px">
    ${tripStatusBadge(s)}
    <span class="badge ${t.type==='international'?'badge-blue':'badge-amber'}">${t.type}</span>
    ${t.destination?.country?`<span class="badge badge-gray">${t.destination.flag||''} ${t.destination.country}</span>`:''}
    <span class="badge badge-gray">${fmt(t.startDate)} – ${fmt(t.endDate)}</span>
  </div>
  <div class="grid-4" style="margin-bottom:16px">
    <div class="stat-tile"><div class="stat-label">Duration</div><div class="stat-value">${daysBetween(t.startDate,t.endDate)}</div><div class="stat-sub">days</div></div>
    <div class="stat-tile"><div class="stat-label">Flights</div><div class="stat-value">${(t.flights||[]).length}</div><div class="stat-sub">segments</div></div>
    <div class="stat-tile"><div class="stat-label">Nights</div><div class="stat-value">${nights}</div><div class="stat-sub">hotel</div></div>
    <div class="stat-tile"><div class="stat-label">Expenses</div><div class="stat-value">${exps.length}</div><div class="stat-sub">${localCur!=='INR'?localCur+' '+localTotal.toFixed(2)+' · ':''} ₹${totalExpINR.toFixed(2)}</div></div>
  </div>
  ${daHtml}
  ${renderFlightsList(t)}${renderHotelsList(t)}${renderSessionsList(t)}${renderExpensesList(t)}${renderPlacesList(t)}${renderInsurance(t)}`;
}

function flightStatusClass(f) {
  const now = new Date();
  const dep = f.depDate ? new Date(f.depDate + 'T' + (f.depTime||'00:00')) : null;
  const arr = f.arrDate ? new Date(f.arrDate + 'T' + (f.arrTime||'00:00')) : null;
  if (!dep) return 'past';
  if (arr && now > arr) return 'past';
  if (now >= dep && arr && now <= arr) return 'active';
  if (now < dep) return 'upcoming';
  return 'past';
}

function flightRowHtml(f, ctx) {
  const fid = 'fl' + f.flightNumber.replace(/[^a-z0-9]/gi,'') + Math.random().toString(36).slice(2,6);
  const legColor = f.leg==='outbound'?'badge-blue':f.leg==='return'?'badge-green':'badge-gray';
  const depFmt = f.depDate ? new Date(f.depDate+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'}) : '';
  const arrFmt = f.arrDate ? new Date(f.arrDate+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'}) : '';
  return `<div class="flight-item" style="${ctx==='active'?'border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.04)':''}">
    <div style="min-width:70px">
      <span class="flight-num" style="cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px"
        onclick="showFlightDetail('${f.flightNumber||''}','${f.from||''}','${f.to||''}','${f.depDate||''}','${f.depTime||''}','${f.arrDate||''}','${f.arrTime||''}','${f.airline||''}')"
      >${f.flightNumber||'—'}</span>
      <div style="margin-top:4px"><span class="badge ${legColor}" style="font-size:8px;padding:1px 5px">${f.leg||''}</span></div>
    </div>
    <div style="flex:1;display:flex;align-items:center;gap:10px">
      <div style="text-align:center">
        <div style="font-size:16px;font-weight:500;font-family:var(--mono)">${f.from}</div>
        <div style="font-size:10px;color:var(--text3);font-family:var(--mono)">${f.depTime||''}</div>
        <div style="font-size:10px;color:var(--text3);font-family:var(--mono)">${depFmt}</div>
      </div>
      <div style="flex:1;text-align:center">
        <div style="font-size:10px;color:var(--text3)">────</div>
        <div style="font-size:10px;color:var(--text2);font-family:var(--mono)">${f.airline||''}</div>
      </div>
      <div style="text-align:center">
        <div style="font-size:16px;font-weight:500;font-family:var(--mono)">${f.to}</div>
        <div style="font-size:10px;color:var(--text3);font-family:var(--mono)">${f.arrTime||''}</div>
        <div style="font-size:10px;color:var(--text3);font-family:var(--mono)">${arrFmt}</div>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">
      ${ctx==='active'?'<span class="badge badge-green" style="font-size:9px">In Air</span>':''}
      <button class="btn btn-secondary btn-sm" id="${fid}" style="font-size:10px;padding:4px 8px"
        onclick="lookupFlightInline('${f.flightNumber}','${fid}')">Live ↗</button>
    </div>
  </div>
  <div id="${fid}-res" style="margin-bottom:4px"></div>`;
}

function renderFlightsList(t) {
  const flights = t.flights||[];
  const active   = flights.filter(f=>flightStatusClass(f)==='active');
  const upcoming = flights.filter(f=>flightStatusClass(f)==='upcoming');
  const past     = flights.filter(f=>flightStatusClass(f)==='past');
  const groupLabel = (label, color, extra) =>
    `<div style="font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:${color};margin:12px 0 6px;padding-top:8px;border-top:1px solid var(--border)">${extra} ${label}</div>`;
  const parts = [
    active.length   ? groupLabel('In Air','var(--green)','🟢')    + active.map(f=>flightRowHtml(f,'active')).join('')   : '',
    upcoming.length ? groupLabel('Upcoming','var(--accent2)','⏭') + upcoming.map(f=>flightRowHtml(f,'upcoming')).join('') : '',
    past.length     ? groupLabel('Completed','var(--text3)','✓')  + past.map(f=>flightRowHtml(f,'past')).join('')        : '',
  ].filter(Boolean).join('');
  return `<div class="sub-section">
    <div class="sub-section-header" onclick="toggleSection(this)">✈️ Flights (${flights.length}) <span>▾</span></div>
    <div class="sub-section-body">
      ${flights.length ? parts : '<div style="color:var(--text3);font-size:12px;padding:8px 0">No flights added yet</div>'}
      <button class="btn btn-secondary btn-sm" style="margin-top:10px" onclick="showAddFlight('${t.id}')">+ Add Flight</button>
    </div>
  </div>`;
}
function renderHotelsList(t) {
  return `<div class="sub-section">
    <div class="sub-section-header" onclick="toggleSection(this)">🏨 Hotels (${(t.hotels||[]).length}) <span>▾</span></div>
    <div class="sub-section-body">
      ${(t.hotels||[]).map(h=>`<div class="hotel-item">
        <div class="hotel-name">${h.name}</div>
        <div class="hotel-meta">${h.city||''} · ${h.checkin||''} → ${h.checkout||''} · ${h.nights||0} nights${h.breakfast?' · B/F incl.':''}</div>
        ${h.confirmationNo?`<div style="font-size:10px;color:var(--text3);font-family:var(--mono);margin-top:2px">Conf: ${h.confirmationNo}</div>`:''}
      </div>`).join('')}
      <button class="btn btn-secondary btn-sm" style="margin-top:8px" onclick="showAddHotel('${t.id}')">+ Add Hotel</button>
    </div>
  </div>`;
}

function renderSessionsList(t) {
  if (!(t.sessions||[]).length) return '';
  return `<div class="sub-section">
    <div class="sub-section-header" onclick="toggleSection(this)">📋 Sessions (${t.sessions.length}) <span>▾</span></div>
    <div class="sub-section-body">
      ${t.sessions.map(s=>{
        const dates = s.dates||[];
        // Group dates by week
        const weeks = [];
        let week = [];
        dates.forEach((d,i)=>{
          const prev = dates[i-1];
          if (prev) {
            const gap = (new Date(d) - new Date(prev)) / 86400000;
            if (gap > 3) { weeks.push(week); week = []; }
          }
          week.push(d);
        });
        if (week.length) weeks.push(week);
        const weekHtml = weeks.length > 0 ? weeks.map((wk,wi)=>`
          <div style="margin-bottom:8px">
            <div style="font-size:9px;color:var(--text3);font-family:var(--mono);margin-bottom:4px">Week ${wi+1} · ${wk.length} day${wk.length!==1?'s':''}</div>
            <div style="display:flex;flex-wrap:wrap;gap:4px">
              ${wk.map(d=>{
                const dt = new Date(d+'T00:00');
                const dayName = dt.toLocaleDateString('en-IN',{weekday:'short'});
                const dayNum = dt.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
                return `<div style="background:var(--surface);border:1px solid var(--border2);border-radius:6px;padding:4px 8px;text-align:center;min-width:52px">
                  <div style="font-size:9px;color:var(--text3);font-family:var(--mono)">${dayName}</div>
                  <div style="font-size:11px;font-family:var(--mono);color:var(--text2)">${dayNum}</div>
                </div>`;
              }).join('')}
            </div>
          </div>`).join('') : '<div style="font-size:11px;color:var(--text3);font-family:var(--mono)">Dates TBD</div>';
        return `<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:8px">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
            <div>
              <div style="font-size:13px;font-weight:500">${s.courseId||'Training Session'}</div>
              <div style="font-size:11px;color:var(--text2);font-family:var(--mono);margin-top:2px">${s.trainer||''} · ${s.pax?s.pax+' pax':''} · ${s.mode||''}</div>
            </div>
            <div style="display:flex;gap:4px;flex-wrap:wrap">
              ${s.recording?'<span class="badge badge-purple">🎥 Recorded</span>':''}
              <span class="badge badge-gray">${s.startTime||''}–${s.endTime||''} IST</span>
              <span class="badge badge-gray">${dates.length} days</span>
            </div>
          </div>
          ${s.venue?`<div style="font-size:11px;color:var(--text2);font-family:var(--mono);margin-bottom:10px;padding:8px;background:var(--surface2);border-radius:6px">📍 ${s.venue}</div>`:''}
          ${weekHtml}
        </div>`;
      }).join('')}
    </div>
  </div>`;
}
function renderExpensesList(t) {
  const exps = t.expenses||[];
  const localCur = t.destination?.currency || 'INR';

  // Compute totals
  let localTotal = 0, grandINR = 0, taINR = 0;
  exps.forEach(e => {
    const cur = e.currency || 'INR';
    const amt = parseFloat(e.amount) || 0;
    if (cur === localCur) localTotal += amt;
    const inr = toINR(amt, cur);
    if (inr !== null) {
      grandINR += inr;
      if (e.isTA) taINR += inr;
    }
  });

  const payIcon = {card:'💳',cash:'💵',upi:'📱','bank transfer':'🏦'};
  const rateNote = frozenRatesDate ? `<span style="font-size:9px;color:var(--text3);font-family:var(--mono);margin-left:6px">rate as of ${frozenRatesDate}</span>` : '';

  const sorted = exps.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));

  const tableRows = sorted.map((e,i)=>{
    const cur = e.currency||'INR';
    const amt = parseFloat(e.amount)||0;
    const inr = toINR(amt, cur);
    const inrStr = inr !== null ? `<div style="font-size:10px;color:var(--text3);font-family:var(--mono)">₹${inr.toFixed(2)}</div>` : '';
    const pmIcon = payIcon[(e.paymentMethod||'').toLowerCase()] || '';
    const dateFmt = e.date ? new Date(e.date+'T00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}).replace(/ /g,'-') : '—';
    return `<tr>
      <td style="font-family:var(--mono);white-space:nowrap">${dateFmt}</td>
      <td>
        <div style="font-size:13px">${e.description||e.category}</div>
        <div style="font-size:10px;color:var(--text3);font-family:var(--mono)">${catEmoji[e.category]||'📦'} ${e.category||''}${e.paymentMethod?` · ${pmIcon} ${e.paymentMethod}`:''}</div>
      </td>
      <td style="text-align:right">
        <div style="font-family:var(--mono)">${cur} ${amt.toFixed(2)}</div>
        ${cur!=='INR'?inrStr:''}
      </td>
      <td style="text-align:center">${e.isTA?'<span class="badge badge-green" style="font-size:8px">TA</span>':''}</td>
      <td style="text-align:right">
        <button class="btn btn-secondary btn-sm" style="font-size:10px;padding:3px 8px" onclick="showEditExpense('${t.id}','${e.id||i}')">Edit</button>
      </td>
    </tr>`;
  }).join('');

  const totalsRow = sorted.length ? `
    <tfoot>
      <tr style="border-top:2px solid var(--border2)">
        <td colspan="2" style="font-size:11px;font-weight:500;color:var(--text2);padding:10px 12px">
          Total · ${exps.length} expense${exps.length!==1?'s':''}
        </td>
        <td style="text-align:right;padding:10px 12px">
          ${localCur!=='INR'?`<div style="font-family:var(--mono);font-size:13px;font-weight:500">${localCur} ${localTotal.toFixed(2)}</div>`:''}
          <div style="font-family:var(--mono);font-size:13px;font-weight:500;color:var(--accent2)">₹${grandINR.toFixed(2)}</div>
          ${rateNote}
        </td>
        <td colspan="2" style="text-align:right;padding:10px 12px">
          ${taINR>0?`<div style="font-size:11px;color:var(--green);font-family:var(--mono)">TA: ₹${taINR.toFixed(2)}</div>`:''}
        </td>
      </tr>
    </tfoot>` : '';

  return `<div class="sub-section">
    <div class="sub-section-header" onclick="toggleSection(this)">💸 Expenses (${sorted.length}) <span>▾</span></div>
    <div class="sub-section-body" style="padding:0">
      ${sorted.length ? `
      <div style="overflow-x:auto">
        <table class="data-table" style="width:100%">
          <thead>
            <tr>
              <th>Date</th>
              <th>Description</th>
              <th style="text-align:right">Amount</th>
              <th style="text-align:center">TA</th>
              <th></th>
            </tr>
          </thead>
          <tbody>${tableRows}</tbody>
          ${totalsRow}
        </table>
      </div>` : '<div style="color:var(--text3);font-size:12px;padding:14px">No expenses added yet</div>'}
      <div style="display:flex;gap:8px;padding:12px 14px;flex-wrap:wrap;border-top:${sorted.length?'1px solid var(--border)':'none'}">
        <button class="btn btn-secondary btn-sm" onclick="showAddExpense('${t.id}')">+ Add Expense</button>
        ${sorted.length?`<button class="btn btn-secondary btn-sm" onclick="getAiExpenseAdvice('${t.id}')">🤖 AI Advice</button>`:''}
      </div>
    </div>
  </div>`;
}

function renderPlacesList(t) {
  const places = t.places||[];
  const manual = places.filter(p=>!p.aiGenerated);
  const ai     = places.filter(p=>p.aiGenerated);
  const visited = places.filter(p=>p.visited).length;

  function placeItem(p, i) {
    const globalIdx = places.indexOf(p);
    return `<div class="place-item">
      <div class="place-icon" style="background:var(--surface)">${catEmoji[p.category]||'📍'}</div>
      <div style="flex:1">
        <div class="place-name">${p.name}</div>
        <div class="place-notes">${p.notes||''}</div>
        <div style="margin-top:3px"><span class="badge badge-gray" style="font-size:8px">${p.category||'misc'}</span></div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;margin-left:8px">
        <button class="btn btn-sm ${p.visited?'btn-primary':'btn-secondary'}" style="font-size:10px;padding:4px 10px"
          onclick="togglePlaceVisited('${t.id}',${globalIdx})">${p.visited?'✓ Done':'Mark visited'}</button>
        ${p.name?`<a href="https://maps.google.com/search?q=${encodeURIComponent(p.name+' '+((t.destination&&t.destination.city)||''))}" target="_blank" style="font-size:10px;color:var(--text3)">Maps ↗</a>`:''}
      </div>
    </div>`;
  }

  return `<div class="sub-section">
    <div class="sub-section-header" onclick="toggleSection(this)">📍 Places (${places.length}${visited?' · '+visited+' visited':''}) <span>▾</span></div>
    <div class="sub-section-body">
      ${manual.length ? `
      <div style="font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:6px">Your List (${manual.length})</div>
      ${manual.map(p=>placeItem(p,places.indexOf(p))).join('')}
      ` : ''}
      ${ai.length ? `
      <div style="font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--purple);margin:12px 0 6px;padding-top:10px;border-top:1px solid var(--border)">🤖 AI Suggestions (${ai.length})</div>
      ${ai.map(p=>placeItem(p,places.indexOf(p))).join('')}
      ` : ''}
      ${!places.length ? '<div style="color:var(--text3);font-size:12px;padding:8px 0">No places added yet</div>' : ''}
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <button class="btn btn-secondary btn-sm" onclick="showAddPlace('${t.id}')">+ Add</button>
        ${t.destination&&t.destination.city?`<button class="btn btn-secondary btn-sm" onclick="getAiPlaces('${t.id}')">🤖 AI Suggest</button>`:''}
      </div>
    </div>
  </div>`;
}
function renderInsurance(t) {
  const ins = t.insurance; if(!ins) return '';
  return `<div class="sub-section">
    <div class="sub-section-header" onclick="toggleSection(this)">🛡 Insurance <span>▾</span></div>
    <div class="sub-section-body"><div class="hotel-item">
      <div class="hotel-name">${ins.provider||'—'}</div>
      <div class="hotel-meta">Policy: ${ins.policyNo||'—'} · ${fmt(ins.validFrom)} – ${fmt(ins.validTo)}</div>

function toggleSection(header) {
  const body = header.nextElementSibling;
  const open = body.style.display !== 'none';
  body.style.display = open ? 'none' : '';
  header.querySelector('span').textContent = open ? '▸' : '▾';
}

// ─── Past ─────────────────────────────────────────────────
function renderPast() {

  document.getElementById('topbar-actions').innerHTML = `<button class="btn btn-primary btn-sm" onclick="showAddTrip()">+ Trip</button>`;
  const pc = document.getElementById('page-container');
  pc.innerHTML = `
  <div class="search-bar" style="margin-bottom:14px">
    <span style="color:var(--text3)">🔍</span>
    <input placeholder="Search by name, country, city..." oninput="filterPastTrips(this.value)" />
  </div>
  <div id="past-trips-grid" class="grid-3">
    ${trips.map(tripCardHtml).join('')}
    ${!trips.length?'<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">📖</div><p>No past trips yet</p></div>':''}
  </div>`;
  window._pastTrips = trips;
}
function filterPastTrips(q) {
  const trips = window._pastTrips||[];
  const f = q ? trips.filter(t=>[t.name,t.destination?.country,t.destination?.city].some(x=>(x||'').toLowerCase().includes(q.toLowerCase()))) : trips;

function renderFlights() {

  const active   = history.filter(f=>{ const d=new Date(f.dep),a=new Date(f.arr); return now>=d&&now<=a; });
  const upcoming = history.filter(f=>new Date(f.dep)>now);
  const past     = history.filter(f=>new Date(f.arr||f.dep)<now);

  function histRow(f) {
    const fid = 'hfl'+Math.random().toString(36).slice(2,7);
    const depDate = f.dep ? new Date(f.dep) : null;
    return `<tr>

        onclick="showFlightDetail('${f.flightNumber||''}','${f.from||''}','${f.to||''}','${(f.dep||'').split('T')[0]}','${(f.dep||'').split('T')[1]||''}','${(f.arr||'').split('T')[0]}','${(f.arr||'').split('T')[1]||''}','')"

      </td>
    </tr>
    <tr id="${fid}-res" style="display:none"><td colspan="4" style="padding:0 12px 8px"></td></tr>`;

    if (!rows.length) return '';
    return `<div style="margin-bottom:20px">
      <div style="font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:${color};margin-bottom:8px">${icon} ${label} (${rows.length})</div>
      <div class="card" style="overflow:hidden">

            <div style="font-size:10px;color:${dep.actual?'var(--green)':'var(--text3)'};font-family:var(--mono)">Actual: ${dep.actual?new Date(dep.actual).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:false}):'—'}</div>

          </div>

            <div style="font-size:10px;color:var(--text2);font-family:var(--mono)">Sched: ${arr.scheduled?new Date(arr.scheduled).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:false}):'—'}</div>
            <div style="font-size:10px;color:${arr.actual?'var(--green)':'var(--text3)'};font-family:var(--mono)">Actual: ${arr.actual?new Date(arr.actual).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:false}):'—'}</div>
            ${arr.terminal?`<div style="font-size:10px;color:var(--text3);font-family:var(--mono)">Terminal ${arr.terminal}${arr.gate?' Gate '+arr.gate:''}</div>`:''}
          </div>
        </div>
      </div>`;
    } else {
      // Show raw error or "no data" with full response for debugging
      const msg = res.error || (res.ok ? 'No flight data returned for today — try on day of flight' : 'API error');
      html = `<div style="background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:10px;margin:4px 0 8px;font-size:11px;color:var(--text2);font-family:var(--mono)">${msg}</div>`;

async function getAiFlightInfo(num, from, to, airline, duration, triggerBtn) {
  const section  = document.getElementById('flight-detail-ai');
  const loading  = document.getElementById('flight-detail-ai-loading');
  const content  = document.getElementById('flight-detail-ai-content');
  if (!section || !content) return;

  // Show loading state
  if (triggerBtn) { triggerBtn.disabled = true; triggerBtn.textContent = '⏳ Loading...'; }
  section.style.display = 'block';
  if (loading) loading.style.display = 'flex';
  content.innerHTML = '';

  try {
    const res = await apiAiFlightInfo(num, from, to, airline, duration);

    if (loading) loading.style.display = 'none';

    if (res.ok && res.info) {
      // Parse the markdown-style text into structured HTML
      content.innerHTML = formatAiFlightGuide(res.info, from, to);
    } else {
      content.innerHTML = `<div style="color:var(--red);font-size:12px;font-family:var(--mono);padding:8px;background:var(--surface2);border-radius:6px">${res.error||'No info returned. Check OpenRouter key in GAS.'}</div>`;
    }
  } catch(e) {
    if (loading) loading.style.display = 'none';
    content.innerHTML = `<div style="color:var(--red);font-size:12px;font-family:var(--mono);padding:8px;background:var(--surface2);border-radius:6px">Error: ${e.message}</div>`;
  }
  if (triggerBtn) { triggerBtn.disabled = false; triggerBtn.textContent = '🤖 Airport Guide & Flight Tips'; }
}

function formatAiFlightGuide(rawText, from, to) {
  // Strip citation markers [1][2][3] but PRESERVE newlines
  const text = rawText.replace(/\[\d+\]/g, '').trim();
  const lines = text.split('\n');

  let html    = '';
  let sectionTitle = '';
  let sectionBody  = [];

  const sectionIcons = {
    'TERMINAL':'🏢', 'CHECK-IN':'🏢', 'ARRIVAL':'🏢', 'OVERVIEW':'🏢',
    'SMOKING':'🚬',
    'FOOD':'🍽️', 'RESTAURANT':'🍽️',
    'LOUNGE':'🛋️',
    'THINGS TO DO':'🎯', 'ACTIVITIES':'🎯',
    'LAYOVER':'⏱️',
    'DURATION':'✈️', 'AIRCRAFT':'✈️',
    'IN-FLIGHT':'🎬', 'ENTERTAINMENT':'🎬',
    'SEAT':'💺',
    'PRACTICAL':'💡', 'TIPS':'💡',
  };

  function getIcon(title) {
    var up = title.toUpperCase();
    var icons = Object.entries(sectionIcons);
    for (var i = 0; i < icons.length; i++) {
      if (up.indexOf(icons[i][0]) !== -1) return icons[i][1];
    }
    return '📌';
  }

  function escapeTags(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function processLine(line) {
    line = escapeTags(line);
    line = line.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    line = line.replace(/\*([^*]+?)\*/g, '<em>$1</em>');
    return line;
  }

  function flushSection() {
    if (!sectionTitle) return;
    var body = sectionBody.join('\n').trim();
    sectionBody = [];
    if (!body) { sectionTitle = ''; return; }
    var icon = getIcon(sectionTitle);
    var bodyLines = body.split('\n');
    var bodyHtml = '';
    for (var bi = 0; bi < bodyLines.length; bi++) {
      var bl = bodyLines[bi].trim();
      if (!bl) { bodyHtml += '<div style="height:4px"></div>'; continue; }
      if (/^[-*\u2022]\s/.test(bl)) {
        bodyHtml += '<div style="display:flex;gap:7px;margin-bottom:4px;line-height:1.5">'
          + '<span style="color:var(--accent2);flex-shrink:0">&#183;</span>'
          + '<span>' + processLine(bl.slice(2)) + '</span></div>';
      } else {
        bodyHtml += '<div style="margin-bottom:4px;line-height:1.5">' + processLine(bl) + '</div>';
      }
    }
    html += '<div style="margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border)">'
      + '<div style="display:flex;align-items:center;gap:7px;margin-bottom:7px">'
      + '<span style="font-size:14px">' + icon + '</span>'
      + '<span style="font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent2)">'
      + escapeTags(sectionTitle) + '</span></div>'
      + '<div style="font-size:12px;color:var(--text2);font-family:var(--mono);padding-left:2px">' + bodyHtml + '</div>'
      + '</div>';
    sectionTitle = '';
  }

  for (var li = 0; li < lines.length; li++) {
    var line = lines[li].trim();

    // H2: ## BLR Departure Airport  (NOT ###)
    if (/^##[^#]/.test(line)) {
      flushSection();
      var h2label = line.replace(/^##\s*/, '').trim();
      var h2icon = (h2label.indexOf(from) !== -1) ? '🛫'
                 : (h2label.indexOf(to)   !== -1) ? '🛬'
                 : (h2label.toUpperCase().indexOf('FLIGHT') !== -1) ? '✈️' : '🏢';
      html += '<div style="font-size:13px;font-weight:500;color:var(--text);'
            + 'margin:16px 0 10px;padding:10px 12px;background:var(--surface2);'
            + 'border-radius:8px;border-left:3px solid var(--accent)">'
            + h2icon + ' ' + escapeTags(h2label) + '</div>';
      continue;
    }

    // H3: ### SMOKING ROOMS
    if (/^###/.test(line)) {
      flushSection();
      sectionTitle = line.replace(/^###\s*/, '').trim();
      continue;
    }

    // Numbered section: 1. SMOKING ROOMS  (fallback for models that ignore ### format)
    if (/^\d+[.)]\s+[A-Z]/.test(line) && line.length < 60) {
      flushSection();
      sectionTitle = line.replace(/^\d+[.)]\s+/, '').trim();
      continue;
    }

    sectionBody.push(line);
  }
  flushSection();

  if (!html) {
    // Fallback: just render as plain text if parsing produced nothing
    html = '<div style="font-size:12px;color:var(--text2);font-family:var(--mono);white-space:pre-wrap;line-height:1.6">'
         + escapeTags(text) + '</div>';
  }

  return '<div style="background:var(--surface2);border:1px solid var(--border);'
       + 'border-radius:var(--r);padding:16px 18px">' + html + '</div>';
}

function doConvert() {

const TIMEZONES = [
  {city:'India (IST)',tz:'Asia/Kolkata',flag:'🇮🇳'},
  {city:'Malaysia',tz:'Asia/Kuala_Lumpur',flag:'🇲🇾'},
  {city:'UAE (Dubai)',tz:'Asia/Dubai',flag:'🇦🇪'},
  {city:'Thailand',tz:'Asia/Bangkok',flag:'🇹🇭'},
  {city:'Nigeria',tz:'Africa/Lagos',flag:'🇳🇬'},
  {city:'Singapore',tz:'Asia/Singapore',flag:'🇸🇬'},
  {city:'UK',tz:'Europe/London',flag:'🇬🇧'},
  {city:'USA (EST)',tz:'America/New_York',flag:'🇺🇸'},
];

// Map destination timezone from trip
const TZ_MAP = {
  'Asia/Kuala_Lumpur':'Asia/Kuala_Lumpur','Asia/Dubai':'Asia/Dubai','Asia/Bangkok':'Asia/Bangkok',
  'Africa/Lagos':'Africa/Lagos','Asia/Singapore':'Asia/Singapore','Asia/Kolkata':'Asia/Kolkata',
  'Europe/London':'Europe/London','America/New_York':'America/New_York',
};

function renderClock() {
  const ctx = getContextTrip();
  const ctxTz = ctx?.destination?.timezone;
  const ctxCity = ctx?.destination?.city||'Destination';
  const ctxFlag = ctx?.destination?.flag||'✈️';

  document.getElementById('page-container').innerHTML = `
  <div id="clock-hero" style="margin-bottom:20px"></div>
  <div style="font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:10px">All Zones</div>
  <div class="grid-4" id="clocks"></div>
  <div style="margin-top:20px" class="card">
    <div class="section-title" style="margin-bottom:10px">Session Time Converter (IST →)</div>
    <div class="form-row">
      <div class="form-group"><label>IST Time</label><input type="time" id="ist-input" value="09:00" oninput="convertSesTime()"></div>
      <div class="form-group"><label>IST Date</label><input type="date" id="ist-date" value="${new Date().toISOString().split('T')[0]}" oninput="convertSesTime()"></div>
    </div>
    <div id="session-conversions" class="grid-3"></div>
  </div>`;
  updateClocks(ctxTz, ctxCity, ctxFlag);

function bigClockHtml(tz, city, flag, highlight) {
  const now = new Date();
  const t = now.toLocaleTimeString('en-US',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  const d = now.toLocaleDateString('en-IN',{timeZone:tz,weekday:'long',day:'numeric',month:'long'});
  const h = parseInt(t);
  const isDay = h>=6&&h<22;
  return `<div style="background:${highlight?'linear-gradient(135deg,rgba(59,130,246,.08),rgba(59,130,246,.02))':'var(--surface2)'};border:1px solid ${highlight?'rgba(59,130,246,.3)':'var(--border)'};border-radius:var(--r);padding:20px;text-align:center">
    <div style="font-size:20px;margin-bottom:6px">${flag} ${isDay?'☀️':'🌙'}</div>
    <div style="font-size:40px;font-weight:300;font-family:var(--mono);letter-spacing:.04em">${t}</div>
    <div style="font-size:13px;font-weight:500;margin-top:6px">${city}</div>
    <div style="font-size:11px;color:var(--text3);font-family:var(--mono);margin-top:2px">${d}</div>
  </div>`;
}

function updateClocks(ctxTz, ctxCity, ctxFlag) {
  const heroEl = document.getElementById('clock-hero');
  const el = document.getElementById('clocks');
  if (!heroEl||!el) { clearInterval(clockInterval); return; }
  const now = new Date();

  // Hero: IST + active trip destination
  let heroHtml = `<div class="grid-2">`;
  heroHtml += bigClockHtml('Asia/Kolkata','India (IST)','🇮🇳',false);
  if (ctxTz && ctxTz !== 'Asia/Kolkata') {
    heroHtml += bigClockHtml(ctxTz, ctxCity, ctxFlag, true);
  } else {
    // Show Malaysia as default if no active trip
    heroHtml += bigClockHtml('Asia/Kuala_Lumpur','Malaysia','🇲🇾',false);
  }
  heroHtml += '</div>';
  heroEl.innerHTML = heroHtml;

  // All zones grid
  el.innerHTML = TIMEZONES.map(tz=>{
    const t = now.toLocaleTimeString('en-US',{timeZone:tz.tz,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
    const d = now.toLocaleDateString('en-IN',{timeZone:tz.tz,weekday:'short',day:'numeric',month:'short'});
    const h = parseInt(t);
    return `<div class="clock-item"><div style="font-size:18px;margin-bottom:3px">${tz.flag} ${h>=6&&h<22?'☀️':'🌙'}</div><div class="clock-time">${t}</div><div class="clock-city">${tz.city}</div><div class="clock-date">${d}</div></div>`;
  }).join('');
}

function convertSesTime() {
  const time = document.getElementById('ist-input')?.value, date = document.getElementById('ist-date')?.value;
  if (!time||!date) return;
  const el = document.getElementById('session-conversions'); if(!el) return;
  const istDate = new Date(`${date}T${time}:00`);
  el.innerHTML = TIMEZONES.filter(t=>t.tz!=='Asia/Kolkata').map(tz=>{
    const cv = istDate.toLocaleTimeString('en-US',{timeZone:tz.tz,hour:'2-digit',minute:'2-digit',hour12:false});
    const cd = istDate.toLocaleDateString('en-IN',{timeZone:tz.tz,day:'numeric',month:'short'});
    return `<div class="card-sm"><div style="font-size:10px;color:var(--text3);font-family:var(--mono)">${tz.flag} ${tz.city}</div><div style="font-size:20px;font-weight:300;font-family:var(--mono);margin-top:3px">${cv}</div><div style="font-size:10px;color:var(--text3);font-family:var(--mono)">${cd}</div></div>`;
  }).join('');
}
// ─── Visas ────────────────────────────────────────────────
function renderVisas() {
  const visas = appData.visas||[];
  document.getElementById('topbar-actions').innerHTML = `<button class="btn btn-primary btn-sm" onclick="showAddVisa()">+ Visa</button>`;
  const now = new Date();
  const active = visas.filter(v=>new Date(v.validUpto+'T23:59:59') >= now);
  const expired = visas.filter(v=>new Date(v.validUpto+'T23:59:59') < now);

  function visaCard(v) {
    const d = Math.ceil((new Date(v.validUpto+'T23:59:59') - now) / 86400000);
    const isExpiring = d<90&&d>0, isExpired = d<=0;
    return `<div class="visa-card" style="${isExpiring?'border-color:rgba(245,158,11,.35)':''}${isExpired?'opacity:.55':''}">
      <div class="visa-country">${v.country} <span class="badge ${isExpired?'badge-red':isExpiring?'badge-amber':'badge-green'}">${isExpired?'Expired':isExpiring?d+'d left':'Valid'}</span></div>
      <div class="visa-meta">${v.type||''} · ${v.entryType||''} entry · ${v.issuedBy||''}</div>
      <div class="visa-expiry" style="color:${isExpired?'var(--red)':isExpiring?'var(--amber)':'var(--text3)'}">Valid: ${fmt(v.validFrom)} → ${fmt(v.validUpto)}</div>
      ${v.notes?`<div style="font-size:10px;color:var(--text3);font-family:var(--mono);margin-top:4px">${v.notes}</div>`:''}
      <div style="margin-top:10px;display:flex;gap:6px">
        <button class="btn btn-secondary btn-sm" onclick="showEditVisa('${v.id}')">Edit</button>
        <button class="btn btn-danger btn-sm" onclick="confirmDeleteVisa('${v.id}')">Delete</button>
      </div>
    </div>`;
  }

  document.getElementById('page-container').innerHTML = `
  ${active.length?`<div class="section-header"><div class="section-title">Active (${active.length})</div></div><div class="grid-3" style="margin-bottom:20px">${active.map(visaCard).join('')}</div>`:''}
  ${expired.length?`<div class="section-header"><div class="section-title">Expired (${expired.length})</div></div><div class="grid-3">${expired.map(visaCard).join('')}</div>`:''}
  ${!visas.length?'<div class="empty-state"><div class="empty-icon">🪪</div><p>No visas recorded</p><button class="btn btn-secondary btn-sm" style="margin-top:8px" onclick="showAddVisa()">Add one</button></div>':''}`;
}

  const url = document.getElementById('gas-url-input')?.value.trim();

async function testGasUrl() {
  const url = getGasUrl();
  if (!url) { toast('No URL configured', 'error'); return; }
  const el = document.getElementById('test-result');
  if (el) { el.textContent = 'Testing...'; el.style.color = 'var(--text2)'; }
  try {
    const token = localStorage.getItem('trip_token')||'test';
    const res = await fetch(`${url}?action=ping&token=${token}`);
    const d = await res.json();
    if (el) {
      if (d.ok || d.code === 401) { el.textContent = '✓ Connected'; el.style.color = 'var(--green)'; }
      else { el.textContent = '✓ Reachable: ' + (d.error||'unknown'); el.style.color = 'var(--amber)'; }
    }
  } catch(e) {
    if (el) { el.textContent = '✗ Failed: ' + e.message; el.style.color = 'var(--red)'; }
  }
}
function signOut() { localStorage.removeItem('trip_token'); location.reload(); }

async function doImportJson() {
  const raw = document.getElementById('import-json').value.trim();
  const errEl = document.getElementById('import-err');
  try {
    const imported = JSON.parse(raw);
    let added = 0;
    if (imported.trips) {
      imported.trips.forEach(t => {
        t.id = t.id || uuid();
        if (!appData.trips.find(x=>x.id===t.id)) { appData.trips.push(t); added++; }
      });
    }
    if (imported.visas) {
      imported.visas.forEach(v => {
        v.id = v.id || uuid();
        if (!appData.visas.find(x=>x.id===v.id)) appData.visas.push(v);
      });
    }
    if (imported.flightHistory) {
      imported.flightHistory.forEach(f => {
        if (!appData.flightHistory.find(x=>x.flightNumber===f.flightNumber&&x.dep===f.dep)) appData.flightHistory.push(f);
      });
    }
    closeModal();
    await apiSave();
    toast(`Imported ${added} trip(s) ✓`);
    navigate('dashboard');
  } catch(e) {
    errEl.textContent = 'Invalid JSON: ' + e.message;
  }
}

async function saveTrip(id) {
  const name = document.getElementById('t-name').value.trim();
  if (!name) { toast('Trip name required','error'); return; }
  const existing = id ? (appData.trips||[]).find(t=>t.id===id) : null;
  const trip = {
    id: id||uuid(), name,
    type: document.getElementById('t-type').value,
    startDate: document.getElementById('t-start').value,
    endDate: document.getElementById('t-end').value,
    destination: {
      city:document.getElementById('t-city').value.trim(),
      country:document.getElementById('t-country').value.trim(),
      currency:document.getElementById('t-currency').value.trim().toUpperCase(),
      flag:document.getElementById('t-flag').value.trim(),
      timezone:document.getElementById('t-tz').value.trim(),
    },
    da: {
      intlRateUSD:parseFloat(document.getElementById('t-da-intl').value)||0,
      indiaRateINR:parseFloat(document.getElementById('t-da-india').value)||0,
      taPolicy:document.getElementById('t-da-policy').value,
    },
    flights:existing?.flights||[],hotels:existing?.hotels||[],sessions:existing?.sessions||[],
    venues:existing?.venues||[],expenses:existing?.expenses||[],places:existing?.places||[],
    insurance:existing?.insurance||null,
  };
  appData.trips = appData.trips||[];
  if (id) { const idx=appData.trips.findIndex(t=>t.id===id); if(idx!==-1) appData.trips[idx]=trip; }
  else appData.trips.push(trip);
  closeModal();
  try { await apiSave(); navigate(currentPage==='tripDetail'?'tripDetail':currentPage, id); } catch(e) { toast(e.message,'error'); }
}

function confirmDeleteTrip(id) {
  const t=(appData.trips||[]).find(x=>x.id===id); if(!t) return;
  showModal(`
  <div class="modal-header"><h2>Delete Trip</h2><button class="btn-icon" onclick="closeModal()">✕</button></div>
  <div class="modal-body"><p style="font-size:13px">Delete <strong>${t.name}</strong>? This cannot be undone.</p></div>
  <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-danger" onclick="deleteTrip('${id}')">Delete</button></div>`);
}
async function deleteTrip(id) {
  appData.trips=(appData.trips||[]).filter(t=>t.id!==id);
  appData.flightHistory=(appData.flightHistory||[]).filter(f=>f.tripId!==id);
  closeModal();
  try { await apiSave(); navigate('past'); } catch(e) { toast(e.message,'error'); }
}

// ─── Flight Modal ─────────────────────────────────────────

  <div class="modal-body">
    <div class="form-row">
      <div class="form-group"><label>Flight Number</label><input id="f-num" placeholder="AI 301"></div>

async function addFlight(tripId) {
  const trip=(appData.trips||[]).find(t=>t.id===tripId); if(!trip) return;
  const flight={id:uuid(),flightNumber:document.getElementById('f-num').value.trim().toUpperCase(),airline:document.getElementById('f-airline').value.trim(),from:document.getElementById('f-from').value.trim().toUpperCase(),to:document.getElementById('f-to').value.trim().toUpperCase(),depDate:document.getElementById('f-dep-date').value,depTime:document.getElementById('f-dep-time').value,arrDate:document.getElementById('f-arr-date').value,arrTime:document.getElementById('f-arr-time').value,leg:document.getElementById('f-leg').value};

// ─── Hotel Modal ──────────────────────────────────────────
function showAddHotel(tripId) {

      <div class="form-group"><label>City</label><input id="h-city" placeholder="Kuala Lumpur"></div>

      <div class="form-group"><label>Check-out</label><input type="date" id="h-out"></div>
    </div>

    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;text-transform:none;font-size:13px;color:var(--text2)"><input type="checkbox" id="h-bf" style="width:auto"> Breakfast included</label>
