  document.getElementById('h-out').addEventListener('change',()=>{ const i=document.getElementById('h-in').value,o=document.getElementById('h-out').value; if(i&&o) document.getElementById('h-nights').value=daysBetween(i,o); });
}
async function addHotel(tripId) {
  const trip=(appData.trips||[]).find(t=>t.id===tripId); if(!trip) return;
  trip.hotels=trip.hotels||[];
  trip.hotels.push({id:uuid(),name:document.getElementById('h-name').value.trim(),city:document.getElementById('h-city').value.trim(),roomType:document.getElementById('h-room').value.trim(),checkin:document.getElementById('h-in').value,checkout:document.getElementById('h-out').value,nights:parseInt(document.getElementById('h-nights').value)||0,confirmationNo:document.getElementById('h-conf').value.trim(),breakfast:document.getElementById('h-bf').checked});
  closeModal(); try { await apiSave(); navigate('tripDetail',tripId); } catch(e) { toast(e.message,'error'); }
}

// ─── Expense Modal (Add + Edit) ───────────────────────────
function showAddExpense(tripId) { showExpenseModal(tripId, null); }
function showEditExpense(tripId, expId) {
  const trip=(appData.trips||[]).find(t=>t.id===tripId); if(!trip) return;
  const exp = (trip.expenses||[]).find(e=>e.id===expId) || (trip.expenses||[])[parseInt(expId)];
  if (exp) showExpenseModal(tripId, exp);
}

function showExpenseModal(tripId, exp) {
  const trip=(appData.trips||[]).find(t=>t.id===tripId); if(!trip) return;
  const isEdit = !!exp;
  const e = exp || {};
  const cur = e.currency || trip.destination?.currency || 'INR';
  const paymentOptions = ['Card','Cash','UPI','Bank Transfer'];

  showModal(`
  <div class="modal-header"><h2>${isEdit?'Edit Expense':'Add Expense'}</h2><button class="btn-icon" onclick="closeModal()">✕</button></div>
  <div class="modal-body">
    <div class="form-row">
      <div class="form-group"><label>Date</label><input type="date" id="e-date" value="${e.date||new Date().toISOString().split('T')[0]}"></div>
      <div class="form-group"><label>Category</label><select id="e-cat">${Object.keys(catEmoji).map(c=>`<option value="${c}" ${e.category===c?'selected':''}>${catEmoji[c]} ${c}</option>`).join('')}</select></div>
    </div>
    <div class="form-group"><label>Description</label><input id="e-desc" value="${e.description||''}" placeholder="e.g. Lunch at KLCC"></div>
    <div class="form-row">
      <div class="form-group"><label>Amount</label><input type="number" id="e-amount" value="${e.amount||''}"></div>
      <div class="form-group"><label>Currency</label><input id="e-currency" value="${cur}"></div>
    </div>
    <div class="form-group"><label>Payment Method</label>
      <select id="e-payment">
        ${paymentOptions.map(p=>`<option value="${p}" ${(e.paymentMethod||'Card')===p?'selected':''}>${p}</option>`).join('')}
      </select>
    </div>
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;text-transform:none;font-size:13px;color:var(--text2);margin-top:4px"><input type="checkbox" id="e-ta" style="width:auto" ${e.isTA?'checked':''}> Travel Allowance (reimbursable)</label>
  </div>
  <div class="modal-footer">
    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveExpense('${tripId}','${isEdit?e.id:''}')"> ${isEdit?'Save Changes':'Add'}</button>
  </div>`);
}

async function saveExpense(tripId, expId) {
  const trip=(appData.trips||[]).find(t=>t.id===tripId); if(!trip) return;
  trip.expenses=trip.expenses||[];
  const payload = {
    id: expId || uuid(),
    date: document.getElementById('e-date').value,
    category: document.getElementById('e-cat').value,
    description: document.getElementById('e-desc').value.trim(),
    amount: parseFloat(document.getElementById('e-amount').value)||0,
    currency: document.getElementById('e-currency').value.trim().toUpperCase()||'INR',
    paymentMethod: document.getElementById('e-payment').value,
    isTA: document.getElementById('e-ta').checked,
  };
  if (expId) {
    const idx = trip.expenses.findIndex(e=>e.id===expId);
    if (idx!==-1) trip.expenses[idx]=payload; else trip.expenses.push(payload);
  } else {
    trip.expenses.push(payload);
  }
  closeModal();
  try { await apiSave(); navigate('tripDetail',tripId); } catch(e) { toast(e.message,'error'); }
}

// ─── Place Modal ──────────────────────────────────────────
function showAddPlace(tripId) {
  showModal(`

    <div class="form-group"><label>Name</label><input id="p-name" placeholder="Twin Towers"></div>

}
async function addPlace(tripId) {
  const trip=(appData.trips||[]).find(t=>t.id===tripId); if(!trip) return;
  trip.places=trip.places||[];
  trip.places.push({id:uuid(),name:document.getElementById('p-name').value.trim(),category:document.getElementById('p-cat').value,notes:document.getElementById('p-notes').value.trim(),visited:false,aiGenerated:false});
  closeModal(); try { await apiSave(); navigate('tripDetail',tripId); } catch(e) { toast(e.message,'error'); }
}
async function togglePlaceVisited(tripId,idx) {
  const trip=(appData.trips||[]).find(t=>t.id===tripId); if(!trip||!trip.places?.[idx]) return;
  trip.places[idx].visited=!trip.places[idx].visited;
  try { await apiSave(); navigate('tripDetail',tripId); } catch(e) { toast(e.message,'error'); }
}

// ─── Visa Modal ───────────────────────────────────────────
function showAddVisa() { showVisaModal(null); }
function showEditVisa(id) { const v=(appData.visas||[]).find(x=>x.id===id); if(v) showVisaModal(v); }
function showVisaModal(visa) {
  const v=visa||{}, isEdit=!!visa;
  showModal(`
  <div class="modal-header"><h2>${isEdit?'Edit Visa':'Add Visa'}</h2><button class="btn-icon" onclick="closeModal()">✕</button></div>
  <div class="modal-body">
    <div class="form-row">
      <div class="form-group"><label>Country</label><input id="v-country" value="${v.country||''}" placeholder="Malaysia"></div>
      <div class="form-group"><label>Type</label><input id="v-type" value="${v.type||''}" placeholder="Tourist / Business"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Issued By</label><input id="v-issuer" value="${v.issuedBy||''}" placeholder="High Commission"></div>
      <div class="form-group"><label>Entry Type</label><select id="v-entry"><option value="single" ${v.entryType==='single'?'selected':''}>Single</option><option value="multiple" ${v.entryType==='multiple'?'selected':''}>Multiple</option></select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Valid From</label><input type="date" id="v-from" value="${v.validFrom||''}"></div>
      <div class="form-group"><label>Valid Until</label><input type="date" id="v-upto" value="${v.validUpto||''}"></div>
    </div>
    <div class="form-group"><label>Notes</label><textarea id="v-notes" rows="2">${v.notes||''}</textarea></div>
  </div>
  <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveVisa(${isEdit?`'${v.id}'`:'null'})">${isEdit?'Save':'Add'}</button></div>`);
}
async function saveVisa(id) {
  const visa={id:id||uuid(),country:document.getElementById('v-country').value.trim(),type:document.getElementById('v-type').value.trim(),issuedBy:document.getElementById('v-issuer').value.trim(),entryType:document.getElementById('v-entry').value,validFrom:document.getElementById('v-from').value,validUpto:document.getElementById('v-upto').value,notes:document.getElementById('v-notes').value.trim()};
  appData.visas=appData.visas||[];
  if (id) { const idx=appData.visas.findIndex(v=>v.id===id); if(idx!==-1) appData.visas[idx]=visa; } else appData.visas.push(visa);
  closeModal(); try { await apiSave(); navigate('visas'); } catch(e) { toast(e.message,'error'); }
}
function confirmDeleteVisa(id) {
  const v=(appData.visas||[]).find(x=>x.id===id); if(!v) return;
  showModal(`<div class="modal-header"><h2>Delete Visa</h2><button class="btn-icon" onclick="closeModal()">✕</button></div><div class="modal-body"><p style="font-size:13px">Delete visa for <strong>${v.country}</strong>?</p></div><div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-danger" onclick="deleteVisa('${id}')">Delete</button></div>`);
}
async function deleteVisa(id) {
  appData.visas=(appData.visas||[]).filter(v=>v.id!==id);
  closeModal(); try { await apiSave(); navigate('visas'); } catch(e) { toast(e.message,'error'); }
}

// ─── AI ───────────────────────────────────────────────────
async function getAiPlaces(tripId) {
  const trip=(appData.trips||[]).find(t=>t.id===tripId); if(!trip?.destination?.city) return;
  toast('Getting AI suggestions...','success',5000);
  try {
    const res=await apiAiSuggest(trip.destination.city,trip.destination.country);
    if (!res.ok) { toast(res.error||'AI failed','error'); return; }
    trip.places=trip.places||[];
    res.places.forEach(p=>{ if(!trip.places.find(x=>x.name.toLowerCase()===p.name.toLowerCase())) trip.places.push({id:uuid(),...p,visited:false,aiGenerated:true}); });
    await apiSave(); navigate('tripDetail',tripId); toast(`Added ${res.places.length} suggestions`);
  } catch(e) { toast('AI failed: '+e.message,'error'); }
}
async function getAiExpenseAdvice(tripId) {
  const trip=(appData.trips||[]).find(t=>t.id===tripId); if(!trip) return;
  const summary={destination:trip.destination,dates:{start:trip.startDate,end:trip.endDate},expenses:trip.expenses||[],totalSpent:(trip.expenses||[]).reduce((a,e)=>a+(parseFloat(e.amount)||0),0),da:trip.da};
  toast('Getting AI advice...','success',5000);
  try {
    const res=await apiAiExpense(summary);
    if (!res.ok) { toast(res.error||'AI failed','error'); return; }
    showModal(`<div class="modal-header"><h2>🤖 AI Advice</h2><button class="btn-icon" onclick="closeModal()">✕</button></div><div class="modal-body"><div class="ai-box"><div class="ai-label">OpenRouter Analysis</div><p>${res.advice}</p></div></div><div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Close</button></div>`);
  } catch(e) { toast('AI failed: '+e.message,'error'); }
}

// ─── Modal Engine ─────────────────────────────────────────
function showModal(html) { document.getElementById('modal-container').innerHTML = `<div class="modal-overlay" onclick="overlayClick(event)"><div class="modal">${html}</div></div>`; }
function closeModal() { document.getElementById('modal-container').innerHTML = ''; }
function overlayClick(e) { if(e.target.classList.contains('modal-overlay')) closeModal(); }
</script>
</body>
</html>
